CAPACITÀ DI APPLICARE CONOSCENZA E COMPRENSIONE: Al termine del corso gli studenti sapranno leggere, comprendere, analizzare, esporre e mettere a confronto i testi.

			<iframe height="100" width="600" srcdoc="<document><p>
	Letteratura italiana</p>
<p>
	Prof. Roberto Mosena</p>
<p>
	Canale Teams: Letteratura italiana triennale Mosena</p>
<p>
	Codice accesso: w0bb7cq</p>
<p>
	&nbsp;</p>
<p>
	Il programma &egrave; valido per 12 cfu per i corsi di laurea in:&nbsp;</p>
<p>
	Lettere (curriculum Archeologia e storia dell&rsquo;arte)</p>
<p>
	LLEA (per chi non ha sostenuto annualit&agrave; di Letteratura italiana durante la triennale)</p>
<p>
	Scienze della storia e del documento&nbsp;</p>
<p>
	LINFO</p>
<p>
	LLEM</p>
<p>
	&nbsp;</p>
<p>
	6 cfu Mod. A&nbsp;</p>
<p>
	Scienze della comunicazione&nbsp;</p>
<p>
	Scienze della storia e del documento&nbsp;</p>
<p>
	LLEA (per chi non ha sostenuto annualit&agrave; di Letteratura italiana durante la triennale)</p>
<p>
	&nbsp;</p>
<p>
	6 cfu Mod. B&nbsp;</p>
<p>
	LLEA (per chi non ha sostenuto annualit&agrave; di Letteratura italiana durante la triennale)&nbsp;</p>
<p>
	&nbsp;</p>
<p>
	&nbsp;</p>
<p>
	Il corso &egrave; suddiviso in tre momenti principali:&nbsp;</p>
<p>
	1) Introduzione allo studio della letteratura italiana considerata nel suo sviluppo storico dalle Origini a fine Ottocento, con presentazione e analisi di alcuni autori e testi esemplari della tradizione.&nbsp;</p>
<p>
	2) Trattazione degli elementi fondamentali di retorica e di metrica.&nbsp;</p>
<p>
	3) Approfondimento monografico del seguente argomento: La letteratura di viaggio in Italia.</p>
<p>
	&nbsp;</p>
<p>
	Testi d&rsquo;esame</p>
<p>
	1) Appunti delle lezioni e un manuale a scelta per lo studio della storia letteraria (per 12 cfu studiare dalle Origini a fine Ottocento; per 6 cfu Mod. A studiare dalle Origini a fine Seicento; per 6 cfu Mod. B studiare dal Settecento a fine Ottocento). Si consiglia G. Leonelli, Istituzioni di letteratura italiana, Studium, Roma 2017 (obbligatorio per i non frequentanti in sostituzione degli appunti delle lezioni).</p>
<p>
	2) Retorica e metrica: A. Menichetti, Prima lezione di metrica, Laterza, Roma-Bari 2013; B. Mortara Garavelli, Il parlar figurato. Manualetto di figure retoriche, Laterza, Roma-Bari 2010 (per 12 cfu entrambi i libri; per 6 cfu Mod. A o Mod. B scegliere 1 libro).</p>
<p>
	3) R. Mosena, Forme del viaggio. Saggi e percorsi letterari in Italia, Mimesis, Milano 2026 (per tutti)</p>
<p>
	4) Preparare, in particolare, i seguenti autori e testi scelti (reperibili nel portale Biblioteca italiana).&nbsp;</p>
<p>
	Per il Mod. A: D. Alighieri, Divina commedia, Inferno, I; F. Petrarca, Canzoniere, 3, 80, 292; L. Ariosto, Orlando furioso, I, XXIII.&nbsp;</p>
<p>
	Per il Mod. B: C. Goldoni, La locandiera; U. Foscolo, Alla sera, A Zacinto; G. Leopardi, L&rsquo;Infinito, A Silvia; G. Verga, Fantasticheria, Malaria; G. Carducci, Traversando la maremma toscana, Alla stazione in una mattina d&rsquo;autunno.</p>
<p>
	5) Eventuali materiali condivisi nel canale Teams dell&rsquo;insegnamento.</p></document>"></iframe>
